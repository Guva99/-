<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Частицы — фигуры по скроллу</title>
<meta name="description" content="Фоновое поле из контурных треугольников, которое пересобирается в фигуры при скролле." />
<meta name="theme-color" content="#FFFFFF" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cpath d='M16 7 26 25H6Z' fill='none' stroke='%23FD622C' stroke-width='2.5'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<canvas class="scene" id="scene" aria-hidden="true"></canvas>

<main>
  <section class="stage" data-formation="scatter"></section>

  <section class="stage stage-right" data-formation="bulb" data-rotate="-30" data-scale="2">
    <div class="figure-slot" aria-hidden="true"></div>
  </section>

  <section class="stage stage-left" data-formation="planet" data-scale="1.64">
    <div class="figure-slot" aria-hidden="true"></div>
  </section>

  <section class="stage" data-formation="chart">
    <div class="figure-slot" aria-hidden="true"></div>
  </section>

  <section class="stage" data-formation="bubble">
    <div class="figure-slot" aria-hidden="true"></div>
  </section>

  <section class="stage" data-formation="envelope">
    <div class="figure-slot" aria-hidden="true"></div>
  </section>
</main>

<script src="assets/main.js" defer></script>
</body>
</html>
